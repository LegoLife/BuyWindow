services:
  buywindow:
    image: buywindow:latest
    container_name: buywindow
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    restart: unless-stopped
    ports:
      # The home network only. The app has no login, and Tiingo's free license is personal use, so don't expose it publicly.
      - "192.168.1.137:8085:8080"
    environment:
      App__Url: http://192.168.1.137:8085
      Tiingo__ApiKey: ${TIINGO_API_KEY:-}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-}
      Smtp__Security: ${SMTP_SECURITY:-}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__AlertRecipient: ${ALERT_EMAIL:-}
    volumes:
      - buywindow-data:/data

volumes:
  buywindow-data:
